# Run `touch mlflow.db` in this directory before `docker compose up`
# so Docker mounts it as a file, not a directory.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    ports:
      - "8501:8501"
      - "5000:5000"
    volumes:
      - ./outputs:/app/outputs
      - ./mlflow.db:/app/mlflow.db
      - hf_cache:/app/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN}
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
