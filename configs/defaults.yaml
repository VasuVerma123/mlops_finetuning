training:
  epochs: 3
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 2.0e-4
  scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 0.3
  optimizer: "paged_adamw_8bit"
  gradient_checkpointing: true
  save_total_limit: 2
  eval_steps_fraction: 0.1
  logging_steps: 5
  seed: 42

evaluation:
  temperature: 0.3
  top_p: 0.9
  max_new_tokens: 800
  repetition_penalty: 1.1
