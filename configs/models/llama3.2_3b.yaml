model_name: "meta-llama/Llama-3.2-3B-Instruct"
display_name: "Llama 3.2 — 3B Instruct"
family: "llama3.2"
size: "3B"

quantization: "4bit"
compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

max_seq_length: 2048
enable_thinking: false
