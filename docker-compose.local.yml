services:
  app:
    build: .
    ports:
      - "8501:8501"
      - "5000:5000"
    volumes:
      - ./outputs:/app/outputs
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    restart: unless-stopped

volumes:
  hf_cache:
